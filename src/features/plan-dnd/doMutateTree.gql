mutation doMutateTree($spec: MutatePlanTree!) {
  planner {
    mutateTree(spec: $spec) {
      # No ids of parents, the returned one or the children's: a parent may
      # be a plan, and writing it back under a PlanItem typename would
      # retype the plan in the cache, where fragments on Plan stop matching.
      # The caller points the parent and its children at each other.
      children {
        id
      }
    }
  }
}
