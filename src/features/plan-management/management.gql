fragment planManagement on Plan {
  id
  name
  color
  mine
  grants {
    level
    user {
      id
      me
    }
  }
  ...planGrants
}

fragment planGrants on Plan {
  id
  owner {
    id
    name
    email
    ...userAvatar
  }
  grants {
    level
    user {
      id
      me
      name
      email
      ...userAvatar
    }
  }
}

fragment plannerPlanBar on Plan {
  id
  name
  color
  mine
  ownedBy {
    id
    name
  }
  grants {
    level
    user {
      id
      me
    }
  }
}

mutation CreateManagedPlan($name: String!) {
  planner {
    createPlan(name: $name) {
      id
    }
  }
}

mutation RenameManagedPlan($id: ID!, $name: String!) {
  planner {
    rename(id: $id, name: $name) {
      id
      name
    }
  }
}

mutation ColorManagedPlan($id: ID!, $color: String!) {
  planner {
    setColor(planId: $id, color: $color) {
      id
      color
    }
  }
}

mutation DeleteManagedPlan($id: ID!) {
  planner {
    deletePlan(id: $id) {
      id
    }
  }
}

mutation SetPlanGrant($planId: ID!, $userId: ID!, $level: AccessLevel!) {
  planner {
    setGrant(planId: $planId, userId: $userId, accessLevel: $level) {
      ...planGrants
    }
  }
}

mutation RevokePlanGrant($planId: ID!, $userId: ID!) {
  planner {
    revokeGrant(planId: $planId, userId: $userId) {
      ...planGrants
    }
  }
}
