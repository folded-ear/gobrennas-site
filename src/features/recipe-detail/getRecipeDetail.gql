query getRecipeDetail($id: ID!, $activePlanId: ID!) {
  library {
    getRecipeById(id: $id) {
      id
      mine
      name
      ownedBy {
        id
        ...userAvatar
      }
      photo {
        url
      }
      ...recipePhoto
      ...ingredientsAndDirections
      ...recipeSections
    }
  }
  ...sendToPlan
}
