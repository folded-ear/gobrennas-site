fragment planItem on PlanItem {
  id
  name
  status
  notes
  parent {
    id
  }
  aggregate {
    id
  }
  preparation
  ingredient {
    id
    ... on Recipe {
      sectionOf {
        id
      }
    }
  }
  quantity {
    quantity
    units {
      name
      id
    }
  }
  components {
    id
  }
  children {
    id
  }
  bucket {
    id
  }
}
