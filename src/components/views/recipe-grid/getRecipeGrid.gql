query getRecipeGrid(
  $query: String! = ""
  $scope: LibrarySearchScope! = MINE
  $first: NonNegativeInt! = 12
  $after: Cursor = null
) {
  library {
    recipes(first: $first, query: $query, scope: $scope, after: $after) {
      edges {
        cursor
        node {
          id
          ...recipeCard
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
